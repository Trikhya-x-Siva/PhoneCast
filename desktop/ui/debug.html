<!doctype html>
<html>
<head><meta charset="utf-8"><title>PhoneCast decode test</title>
<style>body{background:#111;color:#ddd;font:14px monospace;margin:0;padding:12px}canvas{max-width:100%;display:block;margin-top:8px}</style>
</head>
<body>
<div id="out">connecting…</div>
<canvas id="c"></canvas>
<script>
// Measures decode speed of the live phone stream (no Tauri needed).
const out = document.getElementById("out");
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const s = { frames: 0, decoded: 0, drawn: 0, decodeMs: [], arrivalGaps: [], maxQueue: 0, errors: 0, codec: "", hw: "" };
window.stats = s;
let csd = null, dec = null, waitKey = true, lastArrival = 0;
const sent = new Map();

function nals(d){const o=[];let st=-1;for(let i=0;i+2<d.length;i++){if(d[i]===0&&d[i+1]===0&&d[i+2]===1){if(st>=0)o.push(d.subarray(st,i));st=i+3;i+=2}}if(st>=0)o.push(d.subarray(st));return o}
async function configure(codec, c){
  csd = c; waitKey = true;
  const sps = nals(c).find(n => codec===1 ? (n[0]&31)===7 : ((n[0]>>1)&63)===33);
  const h = b => b.toString(16).padStart(2,"0");
  const cs = codec===1 ? `avc1.${h(sps[1])}${h(sps[2])}${h(sps[3])}` : `hev1.${sps[3]&31}.6.L${sps[14]}.B0`;
  let cfg = { codec: cs, optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" };
  s.hw = (await VideoDecoder.isConfigSupported(cfg)).supported ? "hardware" : "fallback";
  if (s.hw !== "hardware") delete cfg.hardwareAcceleration;
  s.codec = cs;
  dec = new VideoDecoder({
    output: f => {
      const t = sent.get(f.timestamp); if (t) { s.decodeMs.push(performance.now() - t); sent.delete(f.timestamp); }
      s.decoded++;
      if (canvas.width !== f.displayWidth) { canvas.width = f.displayWidth; canvas.height = f.displayHeight; }
      const t0 = performance.now(); ctx.drawImage(f, 0, 0); s.drawMs = (s.drawMs||0)*0.9 + (performance.now()-t0)*0.1;
      f.close(); s.drawn++;
    },
    error: e => { s.errors++; s.lastError = String(e); waitKey = true; }
  });
  dec.configure(cfg);
}
const ws = new WebSocket("ws://127.0.0.1:27184");
ws.binaryType = "arraybuffer";
ws.onmessage = ev => {
  const v = new DataView(ev.data), type = v.getUint8(0), flags = v.getUint8(1), pts = Number(v.getBigInt64(2));
  const p = new Uint8Array(ev.data, 10);
  if (type === 1) { configure(p[0], p.slice(5)); return; }
  if (type !== 2 || !dec || dec.state !== "configured") return;
  const now = performance.now();
  if (lastArrival) s.arrivalGaps.push(now - lastArrival); lastArrival = now;
  s.frames++;
  const key = flags & 1;
  if (waitKey && !key) return;
  let data = p;
  if (key) { data = new Uint8Array(csd.length + p.length); data.set(csd); data.set(p, csd.length); waitKey = false; }
  sent.set(pts, now);
  dec.decode(new EncodedVideoChunk({ type: key ? "key" : "delta", timestamp: pts, data }));
  s.maxQueue = Math.max(s.maxQueue, dec.decodeQueueSize);
};
function pct(a, q){ if(!a.length) return 0; const b=[...a].sort((x,y)=>x-y); return b[Math.min(b.length-1, Math.floor(q*b.length))].toFixed(1); }
setInterval(() => {
  window.summary = { codec: s.codec, decoder: s.hw, frames: s.frames, decoded: s.decoded, errors: s.errors,
    decodeMs_p50: pct(s.decodeMs,.5), decodeMs_p95: pct(s.decodeMs,.95), decodeMs_max: pct(s.decodeMs,1),
    arrivalGap_p50: pct(s.arrivalGaps,.5), arrivalGap_p95: pct(s.arrivalGaps,.95), arrivalGap_max: pct(s.arrivalGaps,1),
    drawMs: (s.drawMs||0).toFixed(2), maxDecodeQueue: s.maxQueue, lastError: s.lastError };
  out.textContent = JSON.stringify(window.summary);
}, 1000);
</script>
</body>
</html>
