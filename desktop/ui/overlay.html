<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>PhoneCast chat</title>
  <style>
    :root { color-scheme: dark; font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
    body { display: flex; flex-direction: column; color: #eef0f6; font-size: 13px; }
    .bar { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: rgba(12,14,22,.78); border-radius: 12px 12px 0 0; cursor: move; user-select: none; }
    .bar b { font-weight: 650; }
    .bar small { color: #949bad; margin-left: auto; }
    .bar button { border: 0; background: rgba(255,255,255,.08); color: #eef0f6; border-radius: 7px; width: 24px; height: 24px; cursor: pointer; }
    .list { flex: 1; overflow-y: auto; padding: 8px 10px; background: rgba(12,14,22,.62); border-radius: 0 0 12px 12px; scrollbar-width: thin; }
    .msg { display: grid; grid-template-columns: 4px 1fr; gap: 8px; padding: 4px 0; animation: in .25s ease-out both; }
    @keyframes in { from { opacity: 0; transform: translateY(4px); } }
    .msg i { border-radius: 2px; background: #9146ff; }
    .msg.youtube i { background: #ff3d3d; }
    .msg b { font-weight: 650; margin-right: 6px; color: #c9cde0; }
    .msg.mod b { color: #3fdc97; }
    .msg.spam { opacity: .35; }
    .msg.spam span { text-decoration: line-through; }
    .msg span { overflow-wrap: anywhere; }
    .empty { color: #949bad; text-align: center; margin-top: 30%; }
  </style>
</head>
<body>
  <div class="bar" data-tauri-drag-region><b data-tauri-drag-region>Chat</b><small id="count"></small><button id="hide" title="Hide (turn the overlay on again in AI tools)">×</button></div>
  <div class="list" id="list"><div class="empty">Waiting for chat…</div></div>
  <script>
    const { invoke } = window.__TAURI__.core;
    const { listen } = window.__TAURI__.event;
    const list = document.getElementById("list");
    let n = 0;
    const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    function add(m) {
      if (n === 0) list.innerHTML = "";
      n++;
      const el = document.createElement("div");
      el.className = `msg ${m.platform}${m.spam ? " spam" : ""}${m.privileged ? " mod" : ""}`;
      el.innerHTML = `<i></i><div><b>${esc(m.user)}</b><span>${esc(m.text)}</span></div>`;
      list.appendChild(el);
      while (list.children.length > 80) list.firstChild.remove();
      list.scrollTop = list.scrollHeight;
      document.getElementById("count").textContent = `${n}`;
    }
    listen("ai-chat", (e) => add(e.payload));
    document.getElementById("hide").onclick = () => invoke("ai_set_overlay", { on: false });
    invoke("ai_get_status").then((s) => (s.chat || []).slice(-40).forEach(add)).catch(() => {});
  </script>
</body>
</html>
