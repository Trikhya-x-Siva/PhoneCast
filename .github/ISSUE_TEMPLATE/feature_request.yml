name: Feature request
description: Something PhoneCast should do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the situation, not just the feature. "I want to show chat while fullscreen gaming" beats "add overlay".
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could PhoneCast help?
  - type: checkboxes
    id: checked
    attributes:
      label: Checks
      options:
        - label: I looked at ROADMAP.md and this isn't already planned (or I'm asking to move it up)
