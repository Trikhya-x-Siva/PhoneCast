# Compiles and tests on every push and pull request.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - name: Bundle adb (declared as a resource, so the build script needs it)
        shell: pwsh
        run: ./desktop/fetch-adb.ps1
      - name: Format
        working-directory: desktop/src-tauri
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/src-tauri
        run: cargo clippy -- -D warnings
      - name: Tests
        working-directory: desktop/src-tauri
        run: cargo test

  ai-helper:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: desktop/ai-helper
      - name: Format
        working-directory: desktop/ai-helper
        run: cargo fmt --check
      - name: Clippy
        working-directory: desktop/ai-helper
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        working-directory: desktop/ai-helper
        run: cargo test

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # The Ubuntu runner ships an Android SDK; Gradle downloads the exact
      # platform/build-tools once the licences are accepted.
      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - working-directory: android
        run: chmod +x gradlew && ./gradlew :app:assembleRelease --no-daemon
